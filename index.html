<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>センチメンタル・ハナエ | Purple Games</title>
<meta name="description" content="文化祭実行委員として出会った味村ハナエへの、ひと夏の恋愛アドベンチャー。好感度は表示されません。彼女の反応だけを頼りに、選択肢を選んでください。ブラウザで無料で遊べます。">
<!-- 制作中のため検索避け。完成して Purple Games HP に掲載する時に、この1行を必ず消すこと -->
<meta name="robots" content="noindex, nofollow">
<link rel="canonical" href="https://purplegames-creator.github.io/purple-hanae/">
<meta property="og:type" content="website">
<meta property="og:title" content="センチメンタル・ハナエ">
<meta property="og:description" content="文化祭実行委員として出会った味村ハナエへの、ひと夏の恋愛アドベンチャー。好感度は表示されない。">
<meta property="og:url" content="https://purplegames-creator.github.io/purple-hanae/">
<meta property="og:image" content="https://purplegames-creator.github.io/purple-hanae/assets/ogp.jpg">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💗</text></svg>">
<link rel="preload" as="image" href="assets/logo_title.webp?v=51">
<link rel="stylesheet" href="style.css?v=51">
</head>
<body>

<div class="bg-layer" id="bg-a"></div>
<div class="bg-layer" id="bg-b"></div>
<div id="bg-scrim"></div>
<img id="sprite" class="sprite" alt="">
<img id="sprite-b" class="sprite" alt="" aria-hidden="true">
<!-- 一枚絵(似顔絵など)。scenes の cg で指定。ファイルが無ければ出ない -->
<img id="cg" class="cg" alt="">
<div id="bg-tint"></div>
<div id="rain-layer" class="rain-layer" aria-hidden="true"></div>
<div id="heart-layer"></div>
<!-- タイトルの花びら。ロゴの桜に合わせた飾り。タイトル画面でだけ出す -->
<div id="petals" class="petals" aria-hidden="true">
  <span class="petal"></span><span class="petal"></span><span class="petal"></span><span class="petal"></span>
  <span class="petal"></span><span class="petal"></span><span class="petal"></span><span class="petal"></span>
  <span class="petal"></span><span class="petal"></span>
</div>

<main id="app">

  <div id="hud" class="hud">
    <div class="hud-row">
      <span id="hud-progress" class="hud-progress"></span>
      <span class="hud-actions">
        <button id="btn-sound" class="link-btn js-sound" type="button">♪ オン</button>
        <button id="btn-log" class="link-btn" type="button">これまで</button>
        <button id="btn-title" class="link-btn" type="button">タイトルへ</button>
      </span>
    </div>
    <div class="hud-bar"><span id="hud-bar-fill"></span></div>
  </div>

  <section id="screen-title" class="screen active">
    <h1 class="game-title">
      <img class="game-logo" src="assets/logo_title.webp?v=51" width="960" height="463"
           alt="センチメンタル・ハナエ" fetchpriority="high" decoding="async">
    </h1>
    <p id="tap-hint" class="tap-hint">画面をタップ</p>
    <div id="title-menu" class="title-menu">
      <div class="name-form">
        <label for="player-name-input">あなたの名前(必須)</label>
        <input type="text" id="player-name-input" maxlength="12" placeholder="名前を入力"
               autocomplete="off" aria-describedby="name-error">
        <p id="name-error" class="name-error" role="alert"></p>
      </div>
      <button id="btn-start" class="main-btn">はじめる</button>
      <button id="btn-continue" class="main-btn secondary">つづきから</button>
      <p class="title-sound"><button id="btn-sound-title" class="link-btn js-sound" type="button">♪ オン</button></p>
      <div id="ending-gallery" class="ending-gallery"></div>
    </div>
  </section>

  <section id="screen-prologue" class="screen">
    <div class="textbox prologue-box">
      <div id="prologue-text" class="event-text prologue-text"></div>
    </div>
    <button id="btn-prologue-next" class="main-btn">はじめる</button>
  </section>

  <section id="screen-event" class="screen">
    <div class="textbox">
      <div id="event-text" class="event-text"></div>
    </div>
    <div id="event-choices" class="event-choices"></div>
    <div id="reaction-wrap" class="textbox reaction-wrap">
      <div id="event-reaction" class="event-reaction"></div>
      <div id="reaction-actions" class="reaction-actions"></div>
    </div>
  </section>

  <section id="screen-free" class="screen">
    <h2 class="event-title">準備期間中、まとまった時間が取れる日</h2>
    <p id="free-remaining" class="free-remaining"></p>
    <p class="free-hint">どれか一つを選んでください。選ばなかった行動は、今回は起こりません。</p>
    <div id="free-list" class="free-list"></div>
  </section>

  <section id="screen-confession" class="screen">
    <h2 class="event-title">告白</h2>
    <div class="textbox">
      <div id="confession-text" class="event-text"></div>
    </div>
    <button id="btn-confess" class="main-btn">気持ちを伝える</button>
  </section>

  <section id="screen-ending" class="screen">
    <p id="ending-new" class="ending-new"></p>
    <h2 id="ending-title" class="ending-title"></h2>
    <div class="textbox">
      <div id="ending-text" class="event-text"></div>
    </div>
    <button id="btn-restart" class="main-btn">もう一度プレイする</button>
    <div id="ending-foot">
      <p id="ending-note" class="ending-note">エンディングは全7種類。
選択を変えると結末が変わります。</p>
      <p class="credits">BGM: <a href="https://dova-s.jp/" target="_blank" rel="noopener">DOVA-SYNDROME</a></p>
    </div>
  </section>

</main>

<!-- 場面転換のテロップ(日付と場所)。本文が出る前に一拍置く -->
<div id="telop" class="telop" aria-hidden="true">
  <div id="telop-date" class="telop-date"></div>
  <div id="telop-place" class="telop-place"></div>
</div>
<!-- 暗転。告白→結末、結末→タイトル で使う -->
<div id="fade" class="fade" aria-hidden="true"></div>

<!-- 読み上げ用。1文字ずつ出す本文をそのまま読ませると煩いので、1ブロック出し終えるたびに全文を入れる -->
<div id="sr-live" class="sr-only" aria-live="polite" aria-atomic="true"></div>

<!-- 音の設定。#app の外に置く(中に置くと本文の早送りタップを拾う) -->
<div id="sound-panel" class="sound-panel" role="dialog" aria-label="音の設定" hidden>
  <div class="sound-head">
    <span class="sound-heading">音の設定</span>
    <button id="btn-sound-close" class="link-btn" type="button">閉じる</button>
  </div>
  <label class="sound-row">
    <span class="sound-label">音楽</span>
    <input type="range" id="vol-bgm" min="0" max="100" step="5" value="100">
    <output id="vol-bgm-out" for="vol-bgm">100</output>
  </label>
  <label class="sound-row">
    <span class="sound-label">効果音</span>
    <input type="range" id="vol-se" min="0" max="100" step="5" value="100">
    <output id="vol-se-out" for="vol-se">100</output>
  </label>
  <button id="btn-mute" class="sound-mute" type="button">音を消す</button>
</div>

<div id="log-overlay" class="log-overlay" role="dialog" aria-modal="true"
     aria-labelledby="log-heading" aria-hidden="true">
  <div class="log-panel">
    <div class="log-head">
      <h2 id="log-heading" class="log-heading">これまでの話</h2>
      <button id="btn-log-close" class="link-btn" type="button">閉じる</button>
    </div>
    <div id="log-body" class="log-body" tabindex="0"></div>
  </div>
</div>

<script src="game-data.js?v=51"></script>
<script src="audio.js?v=51"></script>
<script src="game.js?v=51"></script>
</body>
</html>
